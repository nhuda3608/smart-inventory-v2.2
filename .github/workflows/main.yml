name: Build APK v2.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct structure if flat upload
        run: |
          mkdir -p app/src/main/java/bd/smartinventory/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          [ -f app_build.gradle ] && mv app_build.gradle app/build.gradle || true
          [ -f root_build.gradle ] && mv root_build.gradle build.gradle || true
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar || true
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties || true
          [ -f gradlew ] && chmod +x gradlew || true
          for f in LoginActivity.kt OtpVerifyActivity.kt DashboardActivity.kt SaleEntryActivity.kt StockEntryActivity.kt IncomeActivity.kt LedgerActivity.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/bd/smartinventory/app/"$f" || true; done
          for f in activity_dashboard.xml activity_sale_entry.xml activity_stock_entry.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/layout/"$f" || true; done
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/strings.xml || true
          [ -f colors.xml ] && mv colors.xml app/src/main/res/values/colors.xml || true
          if [ -f SmartInventoryApp_ReadyToBuild.zip ]; then unzip -o SmartInventoryApp_ReadyToBuild.zip; mv SmartInventoryApp/* . 2>/dev/null || true; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartInventory-v2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build/outputs/
